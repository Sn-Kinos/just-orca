<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__ORCA_GIT_LOG_TITLE__</title>
<style>
:root{color-scheme:dark;--bg:#0f1216;--panel:#161b22;--panel-2:#1c2230;--line:#262d38;--fg:#e6e9ef;--muted:#a9b3c2;--accent:#5b9cff;--pin:#f2b441;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",sans-serif}
@media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#f7f8fa;--panel:#ffffff;--panel-2:#f0f2f6;--line:#e3e7ee;--fg:#1b2230;--muted:#55617a;--accent:#2f6fe4;--pin:#b7791f}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 var(--sans)}
button,input{font:inherit;color:inherit}
button,summary,label{cursor:pointer}
button{border:1px solid var(--line);border-radius:3px;background:var(--panel);padding:5px 8px}
button:hover{background:var(--panel-2)}
button:disabled,fieldset:disabled label{cursor:default}
input[type=checkbox]{width:14px;height:14px;margin:0;flex-shrink:0;accent-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{position:sticky;top:0;z-index:2;height:48px;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.identity{display:flex;align-items:baseline;gap:12px;flex:1;min-width:0}
h1{font-size:15px;font-weight:600;margin:0;flex-shrink:0;max-width:50%}
h1,.repo-path{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.repo-path{min-width:0;color:var(--muted);font:12px/1.4 var(--mono)}
.toolbar{display:flex;align-items:center;gap:8px;min-width:0}
#filter{width:clamp(180px,26vw,320px);min-width:0;height:28px;padding:4px 8px;border:1px solid var(--line);border-radius:3px;background:var(--bg);font-size:13px}
#filter::placeholder{color:var(--muted);opacity:1}
#repo-toggle{display:none}
#status{position:fixed;bottom:8px;right:12px;z-index:3;max-width:calc(100% - 24px);padding:4px 8px;background:var(--panel);overflow-wrap:anywhere;font-size:12px}
#status:empty{display:none}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr)}
.layout.collapsed{grid-template-columns:36px minmax(0,1fr)}
.layout.collapsed aside{padding:12px 0;overflow:hidden}
.layout.collapsed .aside-bar{justify-content:center;margin:0}
.layout.collapsed .aside-bar h2,.layout.collapsed .aside-bar .text-actions,.layout.collapsed #repo-list{display:none}
#collapse{border:0;background:none;padding:4px;color:var(--muted);font-size:12px;line-height:1;cursor:pointer}
#collapse:hover{color:var(--fg)}
.layout.collapsed #collapse{transform:rotate(180deg)}
@media(prefers-reduced-motion:no-preference){#collapse{transition:transform 120ms}}
aside{position:sticky;top:48px;align-self:start;height:calc(100dvh - 48px);overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:12px}
.aside-bar{position:sticky;top:-12px;z-index:1;display:flex;align-items:center;gap:8px;height:36px;margin-top:-12px;margin-bottom:8px;background:var(--panel)}
.aside-bar .text-actions{margin-left:auto}
h2,.branch-group-name{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;margin:0}
.text-actions{display:flex;align-items:center;gap:3px;flex-shrink:0;color:var(--muted)}
.text-actions button{border:0;background:none;padding:2px;font-size:11px;color:var(--muted)}
.text-actions button:hover{color:var(--fg)}
.repo-tree{list-style:none;margin:0;padding:0 0 0 8px}
.repo-tree .repo-tree{padding-left:16px}
.repo-node{position:relative;border-left:1px solid var(--line);min-width:0}
.repo-row .repo-check{position:absolute;z-index:1;left:-7px;top:9px;width:13px;height:13px;appearance:none;-webkit-appearance:none;border-radius:50%;border:2px solid var(--repo-color);background:var(--panel);cursor:pointer}
.repo-row .repo-check:checked{background:var(--repo-color)}
.repo-row .repo-check:hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--repo-color) 30%,transparent)}
.repo-name{border:0;background:none;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.repo-name:hover{text-decoration:underline}
.repo-row{position:relative;display:flex;align-items:center;gap:8px;height:32px;padding:0 4px 0 14px}
.repo-row:hover,.branch-row:hover,.branches summary:hover{background:var(--panel-2)}
.repo-name,.branch-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.repo-row:has(.root-tag) .repo-name{font-weight:600}
.branch-name{font:13px/1.4 var(--mono);border:0;background:none;padding:0;color:inherit;text-align:left;cursor:pointer}
.branch-name:hover:not(:disabled){text-decoration:underline}
.branch-name:disabled{cursor:default}
.root-tag{font-size:10px;color:var(--muted)}
.count{margin-left:auto;flex-shrink:0;color:var(--muted);font:13px/1.4 var(--mono)}
.error-tag{color:var(--pin);font-size:11px}
.pin-note{display:flex;align-items:center;gap:6px;color:var(--fg);font:12px/1.4 var(--mono);white-space:nowrap}
.pin-note::after{content:"·";color:var(--muted)}
.pin-note::before{content:"";width:5px;height:5px;flex-shrink:0;border-radius:50%;background:var(--muted)}
.pin-note.changed::before{background:var(--pin)}
.branches{margin-left:12px}
summary{list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"";display:inline-block;width:5px;height:5px;border:solid var(--muted);border-width:1px 1px 0 0;transform:rotate(45deg);flex-shrink:0}
details[open]>summary::before{transform:rotate(135deg)}
.branches summary{display:flex;align-items:center;gap:4px;height:24px;color:var(--muted);font-size:12px;white-space:nowrap}
.branch-count{min-width:0;overflow:hidden;text-overflow:ellipsis}
.branches summary::before{order:1;margin-left:2px;transition:transform 120ms}
.branches fieldset{border:0;padding:0 0 8px 6px;margin:0;min-width:0}
.branch-group-bar{display:flex;align-items:center;justify-content:space-between;gap:6px;height:28px}
.branch-group-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.branch-row{display:flex;align-items:center;gap:8px;height:28px;padding:0 4px}
.branch-row input[type=checkbox]{appearance:none;-webkit-appearance:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--repo-color);background:var(--panel);cursor:pointer}
.branch-row input[type=checkbox]:checked{background:var(--repo-color)}
.branch-row input[type=checkbox]:disabled{opacity:.4;cursor:default}
main{min-width:0;padding:12px}
main>p,.history>p{padding:0 12px;color:var(--muted)}
section{margin-bottom:12px;border:1px solid var(--line)}
.section-bar{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;background:var(--panel-2);font:12px/1.4 var(--mono);white-space:nowrap}
.section-name{min-width:0;overflow:hidden;text-overflow:ellipsis;font:600 14px/1.4 var(--sans);letter-spacing:.01em}
.section-bar .badge{min-width:0}
.section-bar .count{margin-left:0;font-size:12px;color:var(--fg)}
.section-actions{margin-left:auto;display:flex;gap:4px}
.section-actions button,#fetch,#pull{padding:2px 8px;font:12px/1.4 var(--mono);border:1px solid var(--line);border-radius:3px;background:none;color:var(--muted);cursor:pointer}
.section-actions button:hover,#fetch:hover,#pull:hover{color:var(--fg);background:var(--panel-2)}
.section-actions button:disabled,#fetch:disabled,#pull:disabled{opacity:.5;cursor:progress}
body:not(.live) .section-actions{display:none}
.history{overflow-x:auto;padding:0 8px}
.row{display:flex;height:40px;align-items:center;cursor:pointer}
.row:hover{background:var(--panel-2)}
.row svg{flex-shrink:0}
.row:focus-visible{outline-offset:-2px}
.text{display:flex;align-items:center;gap:8px;flex:1;min-width:0;height:100%;white-space:nowrap}
.row.filtered .text,.row.filtered + .detail .detail-content{opacity:.25}
.badges{display:flex;gap:4px;flex:0 0 auto;white-space:nowrap}
.badges:empty{display:none}
.badge{display:inline-block;vertical-align:middle;flex:0 0 auto;max-width:12ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid var(--line);border-radius:3px;padding:1px 6px;font:500 12px/1.4 var(--mono)}
.badge-more,.badge.head{flex-shrink:0;min-width:0}
.badge.branch{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.badge.branch.remote{color:var(--muted);background:color-mix(in srgb,var(--muted) 12%,transparent);border-color:color-mix(in srgb,var(--muted) 40%,transparent)}
.head{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
.tag{color:var(--pin);background:color-mix(in srgb,var(--pin) 14%,transparent);border-color:color-mix(in srgb,var(--pin) 50%,transparent)}
.badge-more{color:var(--muted);background:var(--panel-2)}
.pin{background:var(--pin);border-color:var(--pin);color:#0f1216}
.subject{flex:1;min-width:12ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.byline{display:flex;align-items:center;gap:8px;flex-shrink:0;max-width:20ch;font-size:13px}
.author{min-width:0;max-width:10ch;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
time{flex-shrink:0;width:8ch;text-align:right;color:var(--muted);font:12px/1.4 var(--mono)}
.sha{flex-shrink:0;border:0;background:none;color:var(--fg);font:13px/1.4 var(--mono);cursor:pointer;padding:4px}
.row .sha{width:9ch}
.sha:hover{text-decoration:underline}
.detail{display:flex;align-items:stretch;background:var(--panel)}
.detail-graph{position:relative;flex-shrink:0}
.detail-graph svg{position:absolute;inset:0}
.detail-content{flex:1;min-width:0;padding:12px 4px;border-block:1px solid var(--line);overflow-wrap:anywhere}
.detail-subject{font-weight:600}
.detail-body{white-space:pre-wrap;font:inherit}
.detail dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 12px;margin:12px 0 0}
.detail dt{color:var(--muted)}
.detail dd{margin:0;min-width:0}
.detail .sha{text-align:left;overflow-wrap:anywhere;max-width:100%}
.detail time{width:auto}
.repo-path,.branch-name,.count,.pin-note,.branches,.badge,.sha,time{font-variant-numeric:tabular-nums}
@media(max-width:719px){
  header{gap:8px;padding:0 8px}
  #repo-toggle:not([hidden]){display:block}
  .identity{flex:0 1 auto}
  h1{max-width:18vw;flex-shrink:1}
  .repo-path{display:none}
  .toolbar{flex:1}
  #filter{width:100%}
  .layout{grid-template-columns:minmax(0,1fr)}
  aside{display:none;position:sticky;z-index:1;height:auto;max-height:40dvh;border-right:0;border-bottom:1px solid var(--line)}
  aside.open{display:block}
  main{padding:8px}
  .author{display:none}
  .text{gap:4px}
}
@media(max-width:419px){.row time{display:none}}
@media(prefers-reduced-motion:reduce){.branches summary::before{transition:none}}
</style>
</head>
<body>
<header>
  <button id="repo-toggle" type="button" aria-expanded="false" aria-controls="repositories" hidden>Repositories</button>
  <div class="identity"><h1>Git Log Graph</h1><span class="repo-path"></span></div>
  <div class="toolbar">
    <input id="filter" type="search" aria-label="Filter commits" placeholder="filter: author, subject, sha">
    <button id="fetch" type="button" data-git="fetch" title="git fetch --all --prune in the root repository" hidden>Fetch</button>
    <button id="pull" type="button" data-git="pull" title="git pull --ff-only in the root repository" hidden>Pull</button>
    <button id="refresh" type="button" hidden>Refresh</button>
  </div>
</header>
<span id="status" role="status"></span>
<div class="layout">
<aside id="repositories" aria-label="Repositories" hidden>
  <div class="aside-bar">
    <button id="collapse" type="button" aria-expanded="true" aria-controls="repo-list" title="Collapse sidebar">&#9664;</button>
    <h2>Repositories</h2>
    <div class="text-actions"><button type="button" data-select="all">all</button><span aria-hidden="true">·</span><button type="button" data-select="none">none</button></div>
  </div>
  <div id="repo-list"></div>
</aside>
<main><p>No data — run <code>node viz.mjs &lt;repo&gt;</code></p></main>
</div>
<script id="repos" type="application/json">/*__ORCA_GIT_LOG_DATA__*/</script>
<script>
const escape = value => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
const colors = ['#5b9cff', '#f2994a', '#2ec4a6', '#b388ff', '#ff6b8a', '#c9c22f', '#23b5d3', '#a58b6f'];

function RefBadge(ref, remotes = new Set()) {
  const kind = ref === 'HEAD' ? 'head' : ref.startsWith('tag: ') ? 'tag' : remotes.has(ref) ? 'branch remote' : 'branch';
  return `<span class="badge ${kind}" title="${escape(ref)}">${escape(ref)}</span>`;
}

function LaneGraph(row) {
  const x = lane => 16 + lane * 20;
  const paths = row.edges.map(edge =>
    `<path stroke="${colors[edge.from % 8]}" d="M${x(edge.from)},${edge.top * 40 / 36} C${x(edge.from)},30 ${x(edge.to)},30 ${x(edge.to)},40"/>`
  ).join('');
  return `${paths}
    ${row.incoming ? `<path stroke="${colors[row.lane % 8]}" d="M${x(row.lane)},0 V20"/>` : ''}
    <circle cx="${x(row.lane)}" cy="20" r="4" fill="${colors[row.lane % 8]}"/>`;
}

function ShaButton(sha, full = false) {
  return `<button class="sha" data-copy="${escape(sha)}" title="Copy full commit SHA">${escape(full ? sha : sha.slice(0, 8))}</button>`;
}

function CommitDetail(row, lanesWidth) {
  const date = new Date(row.ts * 1000).toISOString();
  const lines = row.edges.map(edge => `<line x1="${16 + edge.to * 20}" x2="${16 + edge.to * 20}" y1="0" y2="100%" stroke="${colors[edge.from % 8]}"/>`).join('');
  return `<div class="detail" hidden>
    <div class="detail-graph" style="width:${lanesWidth}px"><svg width="${lanesWidth}" height="100%" aria-hidden="true" stroke-width="2">${lines}</svg></div>
    <div class="detail-content">
      <div class="detail-subject">${escape(row.subject)}</div>
      ${row.body ? `<pre class="detail-body">${escape(row.body)}</pre>` : ''}
      <dl>
        <dt>SHA</dt><dd>${ShaButton(row.sha, true)}</dd>
        <dt>Parents</dt><dd>${row.parents.map(sha => ShaButton(sha)).join(' ') || 'None'}</dd>
        <dt>Author</dt><dd>${escape(row.author)}</dd>
        <dt>Date</dt><dd><time datetime="${date}">${date}</time></dd>
        <dt>Refs</dt><dd>${row.pinned ? '<span class="badge pin">pinned by superproject</span> ' : ''}${row.refs.map(ref => RefBadge(ref, row.remotes)).join(' ') || (row.pinned ? '' : 'None')}</dd>
      </dl>
    </div>
  </div>`;
}

function CommitRow(row, lanesWidth) {
  const date = new Date(row.ts * 1000).toISOString();
  const badges = [...(row.pinned ? ['<span class="badge pin">pinned by superproject</span>'] : []), ...row.refs.map(ref => RefBadge(ref, row.remotes))];
  return `<div class="commit"><div class="row${row.pinned ? ' pinned' : ''}" role="button" tabindex="0" aria-expanded="false" data-sha="${escape(row.sha)}"
      data-parent-lanes="${row.parentsLanes.join(',')}" data-search="${escape(`${row.sha} ${row.author} ${row.subject}`.toLowerCase())}">
    <svg width="${lanesWidth}" height="40" aria-hidden="true" fill="none" stroke-width="2">${LaneGraph(row)}</svg>
    <div class="text">
      ${ShaButton(row.sha)}
      <span class="badges">${badges.slice(0, 2).join(' ')}${badges.length > 2 ? `<span class="badge badge-more" title="Expand commit for all refs">+${badges.length - 2}</span>` : ''}</span>
      <span class="subject" title="${escape(row.subject)}">${escape(row.subject)}</span>
      <span class="byline"><span class="author" title="${escape(row.author)}">${escape(row.author)}</span>
      <time data-ts="${row.ts}" title="${date}">${date.slice(0, 10)}</time></span>
    </div>
  </div>${CommitDetail(row, lanesWidth)}</div>`;
}

function RepoSection(repo) {
  const head = repo.commits.find(commit => commit.sha === repo.head);
  const branch = head?.refs.find(ref => repo.branches.some(branch => branch.remote === null && branch.label === ref))
    ?? head?.refs.find(ref => ref !== 'HEAD' && !ref.startsWith('tag: '))
    ?? (repo.head.slice(0, 8) || (repo.error ? 'unavailable' : 'unborn'));
  const lanesWidth = Math.max(1, ...repo.rows.map(row => row.width)) * 20 + 16;
  const remotes = new Set((repo.branches ?? []).filter(branch => branch.remote).map(branch => branch.name));
  const rows = repo.rows.map(row => CommitRow({
    ...row,
    pinned: row.sha === repo.pinnedSha,
    refs: [...(row.sha === repo.head ? ['HEAD'] : []), ...row.refs.filter(ref => ref !== 'HEAD')],
    remotes
  }, lanesWidth)).join('\n');
  return `<section data-repo="${escape(repo.name)}"><details open>
    <summary class="section-bar"><span class="section-name" title="${escape(repo.path)}">${escape(repo.basename)}</span>
      <span class="badge" title="${escape(branch)}">${escape(branch)}</span><span class="badge count" title="Commits">${repo.commits.length}</span>
      <span class="badge">${repo.selectedRefs ? `${repo.selectedRefs.length} of ${repo.branches.length} refs` : 'all refs'}</span>
      <span class="section-actions"><button type="button" data-git="fetch" data-git-repo="${escape(repo.name)}" title="git fetch --all --prune">fetch</button><button type="button" data-git="pull" data-git-repo="${escape(repo.name)}" title="git pull --ff-only">pull</button></span></summary>
    <div class="history">${repo.error ? `<p role="alert">${escape(repo.error)}</p>` : rows || '<p>No commits</p>'}</div>
  </details></section>`;
}

function BranchList(repo, refs, live, visible) {
  const selected = new Set(Object.hasOwn(refs, repo.name) ? refs[repo.name] : repo.branches.map(branch => branch.name));
  const groups = new Map();
  for (const branch of repo.branches) {
    const group = branch.remote === null ? 'local' : `remotes/${branch.remote}`;
    if (!groups.has(group)) groups.set(group, []);
    groups.get(group).push(branch);
  }
  return `<details class="branches" data-branches="${escape(repo.name)}"${visible ? '' : ' hidden'}${live ? '' : ' title="branch selection needs the live server"'}>
    <summary id="branches-${escape(encodeURIComponent(repo.name))}">${repo.pinnedSha ? `<span class="pin-note${repo.head && repo.head !== repo.pinnedSha ? ' changed' : ''}" title="${escape(repo.head ? (repo.head === repo.pinnedSha ? 'HEAD matches pin' : 'HEAD differs from pin') : 'HEAD unavailable')}">pinned ${escape(repo.pinnedSha.slice(0, 7))}</span>` : ''}<span class="branch-count">branches ${repo.branches.filter(branch => selected.has(branch.name)).length}/${repo.branches.length}</span></summary>
    ${[...groups].map(([group, branches]) => `<fieldset aria-label="${escape(repo.name + ' ' + group)} branches"${live ? '' : ' disabled'}>
      <div class="branch-group-bar"><span class="branch-group-name" title="${escape(group)}">${escape(group)}</span><div class="text-actions">
        ${['all', 'none'].map(action => `<button type="button" id="group-${escape(encodeURIComponent(JSON.stringify([repo.name, group, action])))}" data-refs="${action}" aria-label="Select ${action} ${escape(group)} branches"${action === 'none' ? ' title="No branches selected uses all refs"' : ''}>${action}</button>`).join('<span aria-hidden="true">·</span>')}
      </div></div>
      ${branches.map(branch => `<div class="branch-row"><input type="checkbox" id="${escape(encodeURIComponent(JSON.stringify([repo.name, branch.name])))}" value="${escape(branch.name)}" aria-label="Show ${escape(branch.label)}"${selected.has(branch.name) ? ' checked' : ''}><button type="button" class="branch-name" data-branch-solo="${escape(branch.name)}" title="${escape(branch.label)} — click to show only this branch"${live ? '' : ' disabled'}>${escape(branch.label)}</button></div>`).join('\n')}
    </fieldset>`).join('\n')}
  </details>`;
}

function Sidebar(repos, selection, refs, live) {
  const children = new Map();
  repos.forEach((repo, index) => {
    if (!children.has(repo.parent)) children.set(repo.parent, []);
    children.get(repo.parent).push({ repo, color: colors[index % colors.length] });
  });
  function tree(parent) {
    return `<ul class="repo-tree">${(children.get(parent) ?? []).map(({ repo, color }) => `<li class="repo-node" style="--repo-color:${color}">
      <div class="repo-row"><input type="checkbox" class="repo-check" id="repo-${escape(encodeURIComponent(repo.name))}" data-repo-select value="${escape(repo.name)}" aria-label="Show ${escape(repo.basename)}"${selection.has(repo.name) ? ' checked' : ''}>
        <button type="button" class="repo-name" data-repo-solo="${escape(repo.name)}" title="${escape(repo.name === '.' ? repo.path : repo.name)} — click to show only this repository">${escape(repo.basename)}</button>${repo.parent === null ? '<span class="root-tag">root</span>' : ''}
        ${repo.error ? `<span class="error-tag" title="${escape(repo.error)}">error</span>` : ''}<span class="count">${repo.commits.length}</span></div>
      ${BranchList(repo, refs, live, selection.has(repo.name))}
      ${children.has(repo.name) ? tree(repo.name) : ''}
    </li>`).join('\n')}</ul>`;
  }
  return tree(null);
}

function render(repos, selection) {
  return repos.filter(repo => selection.has(repo.name)).map(RepoSection).join('\n');
}

function Filter() {
  const query = document.querySelector('#filter').value.toLowerCase();
  document.querySelectorAll('.row').forEach(row => row.classList.toggle('filtered', !row.dataset.search.includes(query)));
}
document.querySelector('#filter').addEventListener('input', Filter);

async function loadData(refs, post = false) {
  const data = document.querySelector('#repos').textContent.trim();
  if (data.startsWith('[')) return { title: document.title, repos: JSON.parse(data) };
  if (!post) document.title = 'Git Log Graph';
  if (location.protocol !== 'http:') return;
  document.querySelector('#status').textContent = 'Loading…';
  const response = await fetch('/data' + location.search, post || Object.keys(refs).length ? {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ limit: Number(new URLSearchParams(location.search).get('limit') ?? 500), refs })
  } : undefined);
  const result = await response.json();
  if (!response.ok) throw new Error(result.error || 'Request failed: ' + response.status);
  if (typeof result.title !== 'string' || !Array.isArray(result.repos)) throw new Error('Invalid repository data');
  return result;
}

async function start() {
  const live = location.protocol === 'http:' && !document.querySelector('#repos').textContent.trim().startsWith('[');
  const refresh = document.querySelector('#refresh');
  refresh.hidden = !live;
  refresh.addEventListener('click', () => location.reload());
  let reload = () => location.reload();
  document.body.classList.toggle('live', live);
  for (const id of ['fetch', 'pull']) document.getElementById(id).hidden = !live;
  document.addEventListener('click', async event => {
    const button = event.target.closest('[data-git]');
    if (!button || !live) return;
    event.preventDefault();
    const status = document.querySelector('#status');
    const op = button.dataset.git, repo = button.dataset.gitRepo ?? '.';
    const label = repo === '.' ? op : `${op} ${repo}`;
    button.disabled = true;
    status.textContent = `${label}…`;
    try {
      const response = await fetch('/git' + location.search, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ op, repo }) });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'Request failed: ' + response.status);
      await reload();
      status.textContent = `${label}: ${result.output.split('\n').pop() || 'done'}`;
    } catch (error) {
      status.textContent = `${label} failed: ${error.message}`;
    } finally {
      button.disabled = false;
    }
  });
  const key = 'git-log-graph:' + location.search;
  let selection;
  let refs = Object.create(null);
  try {
    let saved = JSON.parse(localStorage.getItem(key));
    if (Array.isArray(saved)) saved = { repos: saved };
    if (Array.isArray(saved?.repos) && saved.repos.every(name => typeof name === 'string')) selection = new Set(saved.repos);
    if (saved?.refs && typeof saved.refs === 'object' && !Array.isArray(saved.refs)) {
      Object.assign(refs, Object.fromEntries(Object.entries(saved.refs).filter(([, names]) => Array.isArray(names) && names.every(name => typeof name === 'string'))));
    }
  } catch {} // Storage may be unavailable in file mode.
  try {
    const data = await loadData(refs);
    if (!data) return;
    let { title, repos } = data;
    document.title = title;
    document.querySelector('h1').textContent = repos[0].basename;
    document.querySelector('h1').title = repos[0].basename;
    document.querySelector('.repo-path').textContent = repos[0].path;
    document.querySelector('.repo-path').title = repos[0].path;
    selection ??= new Set(repos.map(repo => repo.name));
    if (!live) refs = Object.fromEntries(repos.filter(repo => repo.selectedRefs).map(repo => [repo.name, repo.selectedRefs]));
    const sidebar = document.querySelector('aside');
    sidebar.hidden = false;
    const repoToggle = document.querySelector('#repo-toggle');
    repoToggle.hidden = false;
    repoToggle.addEventListener('click', () => {
      repoToggle.setAttribute('aria-expanded', String(sidebar.classList.toggle('open')));
    });
    const layout = document.querySelector('.layout');
    const collapse = document.querySelector('#collapse');
    const collapseKey = 'git-log-graph:sidebar-collapsed';
    function setCollapsed(collapsed) {
      layout.classList.toggle('collapsed', collapsed);
      collapse.setAttribute('aria-expanded', String(!collapsed));
      collapse.title = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
      try { localStorage.setItem(collapseKey, collapsed ? '1' : '0'); } catch {}
    }
    try { setCollapsed(localStorage.getItem(collapseKey) === '1'); } catch {}
    collapse.addEventListener('click', () => setCollapsed(!layout.classList.contains('collapsed')));
    function persist() {
      try { localStorage.setItem(key, JSON.stringify({ repos: [...selection], refs })); } catch {}
    }
    function update() {
      const open = new Set([...sidebar.querySelectorAll('details[open]')].map(details => details.dataset.branches));
      const focused = document.activeElement.id;
      document.querySelector('#repo-list').innerHTML = Sidebar(repos, selection, refs, live);
      sidebar.querySelectorAll('details').forEach(details => { details.open = open.has(details.dataset.branches); });
      if (focused) document.getElementById(focused)?.focus();
      document.querySelector('main').innerHTML = render(repos, selection);
      Filter();
      const relative = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
      for (const time of document.querySelectorAll('time[data-ts]')) {
        const seconds = Number(time.dataset.ts) - Date.now() / 1000;
        const [unit, size] = Math.abs(seconds) >= 86400 ? ['day',86400] : Math.abs(seconds) >= 3600 ? ['hour',3600] : ['minute',60];
        time.textContent = relative.format(Math.round(seconds / size), unit);
      }
    }
    function select() {
      selection = new Set([...sidebar.querySelectorAll('[data-repo-select]:checked')].map(input => input.value));
      persist();
      update();
    }
    let request = 0;
    async function selectBranches(details) {
      const selected = [...details.querySelectorAll('input:checked')].map(input => input.value);
      if (selected.length === details.querySelectorAll('input').length) delete refs[details.dataset.branches];
      else refs[details.dataset.branches] = selected;
      details.querySelector('.branch-count').textContent = `branches ${selected.length}/${details.querySelectorAll('input').length}`;
      persist();
      await reloadData();
    }
    async function reloadData() {
      const current = ++request;
      try {
        const data = await loadData(refs, true);
        if (current !== request) return;
        repos = data.repos;
        update();
        document.querySelector('#status').textContent = '';
      } catch (error) {
        if (current === request) document.querySelector('#status').textContent = error.message;
      }
    }
    reload = reloadData;
    sidebar.addEventListener('change', event => {
      if (event.target.matches('[data-repo-select]')) select();
      else if (live && event.target.matches('.branches input')) selectBranches(event.target.closest('details'));
    });
    sidebar.addEventListener('click', event => {
      const branches = event.target.closest('[data-refs]');
      if (branches && live) {
        const details = branches.closest('details');
        branches.closest('fieldset').querySelectorAll('input').forEach(input => { input.checked = branches.dataset.refs === 'all'; });
        selectBranches(details);
        return;
      }
      const branchSolo = event.target.closest('[data-branch-solo]');
      if (branchSolo && live) {
        const details = branchSolo.closest('details');
        details.querySelectorAll('input').forEach(input => { input.checked = input.value === branchSolo.dataset.branchSolo; });
        selectBranches(details);
        return;
      }
      const solo = event.target.closest('[data-repo-solo]');
      if (solo) {
        sidebar.querySelectorAll('[data-repo-select]').forEach(input => { input.checked = input.value === solo.dataset.repoSolo; });
        select();
        return;
      }
      const button = event.target.closest('[data-select]');
      if (!button) return;
      sidebar.querySelectorAll('[data-repo-select]').forEach(input => { input.checked = button.dataset.select === 'all'; });
      select();
    });
    persist();
    update();
    document.querySelector('#status').textContent = '';
  } catch (error) {
    document.querySelector('main').textContent = '';
    document.querySelector('#status').textContent = error.message;
  }
}
start();

function toggleCommit(row) {
  const expanded = row.getAttribute('aria-expanded') !== 'true';
  row.setAttribute('aria-expanded', String(expanded));
  row.nextElementSibling.hidden = !expanded;
}

document.addEventListener('keydown', event => {
  if (!event.target.matches('.row') || !['Enter', ' '].includes(event.key)) return;
  event.preventDefault();
  if (!event.repeat) toggleCommit(event.target);
});

document.addEventListener('click', async event => {
  const button = event.target.closest('[data-copy]');
  if (!button) {
    const row = event.target.closest('.row');
    if (row) toggleCommit(row);
    return;
  }
  const status = document.querySelector('#status');
  try {
    await navigator.clipboard.writeText(button.dataset.copy);
    status.textContent = 'Copied ' + button.dataset.copy;
  } catch {
    const input = document.createElement('textarea');
    input.value = button.dataset.copy;
    document.body.append(input);
    input.select();
    status.textContent = document.execCommand('copy') ? 'Copied ' + input.value : 'Copy failed: ' + input.value;
    input.remove();
    button.focus();
  }
});
</script>
